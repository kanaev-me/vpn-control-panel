name: apply live session runtime fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/collect-live-vpn-sessions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collect-live-vpn-sessions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact runtime edits
        run: python3 scripts/apply-live-session-runtime-fix.py
      - name: Validate
        run: make check
      - name: Commit transformed sources
        run: |
          if git diff --quiet -- panel/app.py panel/behavior_build.py; then
            echo "runtime sources already transformed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add panel/app.py panel/behavior_build.py
          git commit -m "Use live service state and bootstrap behavior inputs"
          git push origin HEAD:agent/collect-live-vpn-sessions
