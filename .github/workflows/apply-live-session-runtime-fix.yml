name: apply live session runtime fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/collect-live-vpn-sessions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collect-live-vpn-sessions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact runtime edits
        run: |
          python3 scripts/apply-live-session-runtime-fix.py
          python3 scripts/apply-live-session-test-fix.py
      - name: Validate
        run: |
          set +e
          make check > check.log 2>&1
          status=$?
          cat check.log
          exit "$status"
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-session-validation-log
          path: check.log
          if-no-files-found: error
      - name: Commit transformed sources
        run: |
          paths=(
            panel/app.py
            panel/behavior_build.py
            scripts/materialize-tenant-panel.py
            tests/test_materialize_tenant_panel.py
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "runtime sources already transformed"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${paths[@]}"
          git commit -m "Use live service state and bootstrap behavior inputs"
          git push origin HEAD:agent/collect-live-vpn-sessions
