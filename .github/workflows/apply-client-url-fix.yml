name: apply client URL fix

on:
  push:
    branches:
      - agent/encode-client-query-values

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/encode-client-query-values
          fetch-depth: 0
      - name: Apply exact source transformation
        run: python3 scripts/apply-client-url-encoding-fix.py
      - name: Validate transformed repository
        run: make check
      - name: Commit generated source change
        run: |
          if git diff --quiet -- panel/app.py; then
            echo "No generated change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel/app.py
          git commit -m "Encode client names in query URLs"
          git push origin HEAD:agent/encode-client-query-values
